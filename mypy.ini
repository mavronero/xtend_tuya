# Strict typing for the packages built in the layering refactor
# (docs/architecture.md §1, principle 8). Upstream code is not covered.
# Run: .venv-test/bin/mypy
[mypy]
python_version = 3.14
strict = True
follow_imports = silent
ignore_missing_imports = True
explicit_package_bases = True
files =
    custom_components/xtend_tuya/transport,
    custom_components/xtend_tuya/entity_parser/valves/codecs,
    custom_components/xtend_tuya/entity_parser/valves/profiles.py,
    custom_components/xtend_tuya/entity_parser/valves/driver.py,
    custom_components/xtend_tuya/entity_parser/valves/timer_state.py,
    custom_components/xtend_tuya/farm/contract.py,
    custom_components/xtend_tuya/farm/location_model.py,
    custom_components/xtend_tuya/farm/water_math.py
