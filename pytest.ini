[pytest]
# Real Home Assistant harness (pytest-homeassistant-custom-component), see
# tests/ha/README.md. The standalone self-checks in tests/*.py are run with
# `python3 tests/<file>.py` and are deliberately not collected here.
testpaths = tests/ha
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
pythonpath = .
log_level = WARNING
